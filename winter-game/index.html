<style>

  canvas{display:block}

  #order{position:fixed;right:18px;top:60px;background:#fffd;color:#333;padding:10px 16px;border-radius:14px;font-size:17px;text-shadow:none;display:none}
  #help{position:fixed;left:18px;bottom:14px;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;white-space:pre-line}
  #cross{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:#fff8;display:none}

</head>
